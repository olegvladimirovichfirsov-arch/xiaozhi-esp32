name: Build modular UI (1.85B)

on:
  workflow_dispatch:
  push:
    branches:
      - custom-ui-185b

permissions:
  contents: read

jobs:
  build:
    name: Build esp32-s3-touch-lcd-1.85b-modui
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py esp32-s3-touch-lcd-1.85b-modui --name esp32-s3-touch-lcd-1.85b-modui --language ru-RU

      - name: Upload merged image
        uses: actions/upload-artifact@v7
        with:
          name: modui_1.85b_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
